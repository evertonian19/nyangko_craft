<title>골목냥 대전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* 레이아웃: [골드·본진 줄] → [16:9 골목 무대] → [진형 명령 3개] → [고양이 카드 5장] → [강화 5개]. 밤 골목의 남색 + 가로등 노랑. 게임이라 한 가지 룩으로 고정. */
:root {
  --page: #14172b;
  --panel: #23284a;
  --panel-hi: #333a68;
  --ink: #241c2e;
  --paper: #fff4dc;
  --dim: #aeb3d6;
  --lamp: #ffcf5a;
  --blue: #4a86ff;
  --red: #ff5a4b;
  --mint: #5fd3a8;
  --font: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--page); color: var(--paper); font-family: var(--font); font-size: 16px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 1120px; margin: 0 auto; display: grid; gap: 10px; }
button { font-family: var(--font); color: var(--ink); cursor: pointer; }
button:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }

.hud { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.stat { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 3px solid var(--ink); border-radius: 16px; padding: 6px 14px 6px 8px; min-width: 0; flex: 1 1 250px; max-width: 420px; }
.coin-ic { flex: none; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3a8, var(--lamp) 55%, #e0a100); border: 3px solid var(--ink); position: relative; }
.coin-ic::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; border: 2px solid rgba(36, 28, 46, .45); }
#coinN { font-size: 26px; min-width: 2.4ch; text-align: right; font-variant-numeric: tabular-nums; }
#inc { font-size: 14px; color: var(--mint); white-space: nowrap; }
.lv { margin-left: auto; font-size: 15px; background: var(--ink); border-radius: 10px; padding: 2px 10px; white-space: nowrap; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { position: relative; overflow: hidden; background: var(--paper); border: 3px solid var(--ink); border-bottom-width: 6px; border-radius: 14px; padding: 6px 14px; font-size: 17px; line-height: 1.2; }
.btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.btn.on { background: var(--lamp); }
.btn.go { background: var(--mint); font-size: 22px; padding: 10px 26px; }
.btn.big { background: var(--lamp); padding-inline: 18px; }
.btn .cd { position: absolute; left: 0; bottom: 0; height: 100%; width: 100%; background: rgba(36, 28, 46, .35); transform-origin: left; pointer-events: none; }
.btn.ready { animation: glow 1s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 0 5px rgba(255, 207, 90, .55); } }
#bRec { display: none; } #bRec.show { display: block; }
#bRec::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--red); margin-right: 7px; }

.stage { position: relative; aspect-ratio: 16 / 9; width: 100%; border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; background: #1a1d36; container-type: inline-size; touch-action: manipulation; }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ov { position: absolute; inset: 0; display: grid; place-items: center; padding: 3cqw; background: rgba(20, 23, 43, .6); }
.ov[hidden] { display: none; }
.card { background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 22px; padding: 2.4cqw 4cqw 2.8cqw; text-align: center; max-width: 92%; box-shadow: 0 1.2cqw 0 rgba(0, 0, 0, .5); display: grid; gap: 1.4cqw; justify-items: center; }
.logo { margin: 0; font-weight: 400; line-height: 1; transform: rotate(-3deg); }
.logo small { display: block; font-size: 3.2cqw; letter-spacing: .3em; margin-bottom: .6cqw; }
.logo b { font-weight: 400; font-size: 10cqw; letter-spacing: -.02em; display: inline-block; }
.logo b span { display: inline-block; color: var(--c); -webkit-text-stroke: .5cqw var(--ink); paint-order: stroke fill; text-shadow: 0 .8cqw 0 var(--ink); }
.logo b span:nth-child(even) { transform: translateY(.8cqw) rotate(4deg); }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: .5cqw; font-size: clamp(11px, 2cqw, 18px); text-align: left; }
.how b { color: #c2410c; font-weight: 400; }
.card .btn.go { font-size: clamp(16px, 3cqw, 28px); }
#endT { margin: 0; font-weight: 400; font-size: 8cqw; line-height: 1; }
#endT.win { color: #1c9b6f; } #endT.lose { color: #d4380d; }
#stars { font-size: 6cqw; line-height: 1; letter-spacing: .4cqw; color: #d9d2c4; }
#stars i { font-style: normal; } #stars i.on { color: var(--lamp); -webkit-text-stroke: .35cqw var(--ink); }
#endS { margin: 0; font-size: clamp(12px, 2.4cqw, 22px); }
#rec { position: absolute; top: 2cqw; left: 2cqw; background: rgba(36, 28, 46, .85); border-radius: 999px; padding: .5cqw 1.8cqw; font-size: clamp(11px, 2cqw, 18px); display: flex; gap: .8cqw; align-items: center; }
#rec[hidden] { display: none; }
#rec::before { content: ''; width: 1.6cqw; height: 1.6cqw; border-radius: 50%; background: var(--red); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .15; } }
#toast { position: absolute; left: 50%; bottom: 3cqw; transform: translateX(-50%); background: var(--ink); border-radius: 999px; padding: .8cqw 2.6cqw; font-size: clamp(12px, 2.3cqw, 20px); white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.show { opacity: 1; }

.deck, .ups { display: grid; gap: 8px; min-width: 0; }
.deck { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.ups { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.unit, .up { position: relative; overflow: hidden; display: grid; justify-items: center; align-content: start; gap: 2px; background: var(--paper); border: 3px solid var(--ink); border-bottom-width: 7px; border-radius: 16px; padding: 4px 3px 6px; min-width: 0; }
.unit:active, .up:active { transform: translateY(3px); border-bottom-width: 4px; }
.unit canvas { width: 100%; max-width: 88px; height: auto; aspect-ratio: 88 / 72; }
.nm { font-size: clamp(11px, 2.9vw, 17px); line-height: 1.15; text-align: center; }
.rl { font-size: clamp(9px, 2.2vw, 12px); background: var(--ink); color: var(--paper); border-radius: 6px; padding: 0 6px; }
.ct { display: flex; align-items: center; gap: 5px; font-size: clamp(12px, 3.2vw, 18px); }
.ct i, .uc i { width: 13px; height: 13px; border-radius: 50%; background: var(--lamp); border: 2px solid var(--ink); display: inline-block; }
.key { position: absolute; top: 3px; left: 5px; font-size: 12px; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 0 5px; }
.cdf { position: absolute; inset: 0; background: rgba(36, 28, 46, .45); transform-origin: top; transform: scaleY(0); pointer-events: none; }
.lock { position: absolute; inset: 0; display: none; place-items: center; background: rgba(20, 23, 43, .78); color: var(--paper); font-size: clamp(11px, 2.8vw, 16px); text-align: center; padding: 4px; }
.unit.locked .lock { display: grid; }
.unit.poor, .up.poor { filter: grayscale(.8) brightness(.78); }
.up { background: #e8ecff; }
.up.base { background: #ffe9b0; }
.un { font-size: clamp(11px, 2.9vw, 16px); text-align: center; line-height: 1.15; }
.ud { font-size: clamp(9px, 2.2vw, 12px); color: #4a4560; text-align: center; line-height: 1.15; }
.pips { display: flex; gap: 4px; }
.pips i { width: 11px; height: 11px; border-radius: 50%; background: #c9c4dc; border: 2px solid var(--ink); }
.pips i.on { background: var(--mint); }
.uc { display: flex; align-items: center; gap: 5px; font-size: clamp(12px, 3.2vw, 17px); }
.up.max .uc { visibility: hidden; }
.keys { margin: 0; font-size: 13px; color: var(--dim); text-align: center; }
@media (max-width: 560px) { .btn { font-size: 15px; padding: 5px 10px; } .key { display: none; } .unit canvas { max-width: 64px; } }
@media (prefers-reduced-motion: reduce) { .btn.ready, #rec::before { animation: none; } }
</style>

<main class="app">
  <header class="hud">
    <div class="stat" aria-label="골드와 본진 레벨"><span class="coin-ic"></span><b id="coinN">0</b><span id="inc"></span><span class="lv">본진 Lv <b id="lvN">1</b></span></div>
    <div class="tools">
      <button class="btn big" id="bSpecial" type="button"><span>참치캔 낙하 (스페이스)</span><i class="cd" id="cdBar"></i></button>
      <button class="btn" id="bSlow" type="button">슬로모션</button>
      <button class="btn" id="bMute" type="button">소리 켜짐</button>
      <button class="btn" id="bRec" type="button">녹화</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <canvas id="cv" width="1280" height="720" aria-label="골목길에서 고양이 군대가 싸우는 장면"></canvas>
    <div id="rec" hidden>REC <span id="recT">0:00</span></div>
    <div id="toast" role="status"></div>
    <div class="ov" id="ovTitle">
      <div class="card">
        <h1 class="logo"><small>밤 골목 영역 다툼</small><b><span style="--c:#4a86ff">골</span><span style="--c:#ffb02e">목</span><span style="--c:#ff5a4b">냥</span> <span style="--c:#2fae85">대</span><span style="--c:#ff8a3d">전</span></b></h1>
        <ul class="how">
          <li>골드로 <b>길냥이 · 도적냥이</b>를 뽑고, <b>본진을 키우면</b> 전사 · 마법사 · 용사냥이가 해금돼요</li>
          <li>골드는 병력뿐 아니라 <b>수입 · 공속 · 공격 · 방어</b> 강화에도 써요. 지금 뽑을지, 키울지가 승부처!</li>
          <li>고양이들은 알아서 <b>앞으로 돌격</b>해요. 상대 본진 체력을 0으로 만들면 승리!</li>
        </ul>
        <button class="btn go" id="bStart" type="button">시작하기</button>
      </div>
    </div>
    <div class="ov" id="ovEnd" hidden>
      <div class="card">
        <h2 id="endT">승리!</h2>
        <div id="stars" aria-label="별점"></div>
        <p id="endS"></p>
        <button class="btn go" id="bAgain" type="button">한 번 더</button>
      </div>
    </div>
  </section>

  <nav class="deck" id="deck" aria-label="고양이 소환"></nav>
  <nav class="ups" id="ups" aria-label="강화"></nav>
  <p class="keys">1~5 소환 · B 본진 · G/H/J/K 수입/공속/공격/방어 · 스페이스 참치캔 · S 슬로모션 · M 소리</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
'use strict';
const { Engine, Bodies, Body, Composite, Events } = Matter;
const W = 1280, H = 720, GROUND = 610, INK = '#241c2e';
const CATC = { ground: 1, unit: 2, debris: 8, can: 32 };
const TEAM = [
  { main: '#4a86ff', dark: '#2450b4', light: '#a9c8ff' },
  { main: '#ff5a4b', dark: '#b02a20', light: '#ffb7ad' },
];
const $ = (id) => document.getElementById(id);
const cv = $('cv');
let c = cv.getContext('2d');   // 아이콘을 그릴 때만 잠시 다른 캔버스로 바꾼다
const mainCtx = c;
const rnd = (a, b) => a + Math.random() * (b - a), pick = (a) => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;

/* ---------------- 규칙 데이터 ---------------- */
// 고양이 5단계. unlock = 필요한 본진 레벨. k 가 클수록 덩치가 크고 표정이 사나워진다.
const CATS = [
  { k: 0, name: '길냥이', role: '전열', cost: 25, hp: 45, atk: 6, cd: 36, rng: 26, spd: 1.6, w: 30, h: 34, sc: 0.9, unlock: 1, iconS: 1.6, iconY: 38 },
  { k: 1, name: '도적냥이', role: '암살', cost: 40, hp: 34, atk: 9, cd: 24, rng: 24, spd: 2.7, w: 28, h: 32, sc: 0.95, unlock: 1, iconS: 1.6, iconY: 38 },
  { k: 2, name: '전사냥이', role: '전열', cost: 75, hp: 160, atk: 11, cd: 44, rng: 32, spd: 1.2, w: 40, h: 44, sc: 1.2, unlock: 2, iconS: 1.5, iconY: 40 },
  { k: 3, name: '마법사냥이', role: '후열', cost: 110, hp: 52, atk: 20, cd: 100, rng: 300, spd: 1.3, w: 34, h: 42, sc: 1.05, unlock: 3, iconS: 1.2, iconY: 46 },
  { k: 4, name: '용사냥이', role: '전열', cost: 230, hp: 400, atk: 28, cd: 58, rng: 54, spd: 1.1, w: 58, h: 62, sc: 1.8, unlock: 4, iconS: 1.4, iconY: 40 },
];
const BASE_HP = [600, 900, 1200, 1500];
const BASE_INC = [6, 8.5, 11, 14];
const UP_COST = { base: [120, 260, 480], eco: [90, 170, 300], spd: [90, 170, 300], atk: [90, 170, 300], def: [90, 170, 300] };
const GOLD_CAP = 600, EDGE = 215, BASE_CX = 140, MAX_CATS = 28;
const UNLOCK_NAME = ['', '전사냥이', '마법사냥이', '용사냥이'];

const mkSide = () => ({ gold: 60, baseLv: 1, hp: BASE_HP[0], up: { eco: 0, spd: 0, atk: 0, def: 0 }, hurt: 0 });
let S = [mkSide(), mkSide()];
const incomeOf = (t) => BASE_INC[S[t].baseLv - 1] * (1 + 0.2 * S[t].up.eco) * (t ? G.aiMul : 1);

/* ---------------- 소리 (WebAudio 합성) ---------------- */
let AC = null, master = null, recDest = null, muted = false;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
      recDest = AC.createMediaStreamDestination(); master.connect(recDest);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type = 'sine', vol = 0.25, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, cut = 1200, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = cut; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const meow = (k, vol = 0.22) => { const f = 980 - k * 140; tone(f * 0.8, f * 1.35, 0.1, 'sine', vol); tone(f * 1.35, f * 0.7, 0.2, 'sine', vol * 0.9, 0.09); };
const SFX = {
  spawn() { tone(380, 760, 0.09, 'square', 0.1); },
  hit() { noise(0.07, 0.22, 1800); tone(220, 110, 0.07, 'triangle', 0.14); },
  slash() { noise(0.1, 0.2, 5000); tone(1200, 400, 0.09, 'sawtooth', 0.08); },
  pop() { tone(300, 1100, 0.12, 'sine', 0.28); },
  shoot() { tone(500, 1300, 0.18, 'sine', 0.14); tone(260, 120, 0.1, 'sawtooth', 0.06); },
  heavy() { noise(0.25, 0.55, 700); tone(110, 45, 0.3, 'sine', 0.45); tone(900, 300, 0.15, 'square', 0.07); },
  zap() { tone(1200, 200, 0.25, 'sawtooth', 0.12); tone(600, 1500, 0.15, 'sine', 0.14); },
  boom() { noise(0.7, 0.8, 500); tone(130, 30, 0.6, 'sine', 0.6); },
  boom2() { noise(0.35, 0.5, 900); tone(160, 50, 0.3, 'sine', 0.35); },
  buy() { tone(660, 990, 0.1, 'square', 0.12); tone(990, 1320, 0.12, 'square', 0.12, 0.09); },
  lvup() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, 'square', 0.14, i * 0.09)); },
  no() { tone(200, 150, 0.12, 'square', 0.1); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.18, 'square', 0.16, i * 0.12)); },
  lose() { [392, 370, 349, 330].forEach((f, i) => tone(f, f * 0.92, 0.3, 'sawtooth', 0.16, i * 0.22)); },
};
const lastSfx = {};
function sfx(name) {
  const now = performance.now();
  if (now - (lastSfx[name] || 0) < 45) return;
  lastSfx[name] = now; SFX[name]();
}

/* ---------------- 그리기 도구 ---------------- */
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const fs = (fill, lw = 2.4) => { c.fillStyle = fill; c.fill(); c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = 'round'; c.stroke(); };
const ell = (x, y, rx, ry) => { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); };
const circ = (x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); };
const tri = (a, b, c2, d, e, f) => { c.beginPath(); c.moveTo(a, b); c.lineTo(c2, d); c.lineTo(e, f); c.closePath(); };
const line = (x1, y1, x2, y2, w = 1.6, col = INK) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineWidth = w; c.strokeStyle = col; c.lineCap = 'round'; c.stroke(); };

/* ---------------- 고양이 그리기: 디자인 좌표(몸 중심 0,0 · 발 y=17 · 오른쪽을 봄) ---------------- */
const FUR = [
  { m: '#f2a65a', b: '#fff0d6', s: '#d9822b' },   // 길냥이: 치즈 태비
  { m: '#41394f', b: '#6d6482', s: '#2b2536' },   // 도적냥이: 검은 고양이
  { m: '#a9b2c6', b: '#f4f6fb', s: '#7e879b' },   // 전사냥이: 회색
  { m: '#efe3cf', b: '#fffaf0', s: '#6b5470' },   // 마법사냥이: 샴
  { m: '#e08a2e', b: '#ffe3b0', s: '#3a1d12' },   // 용사냥이: 흉터투성이 호랑이
];

function pTail(k, s) {
  const F = FUR[k], w = Math.sin(s.t * 0.9) * 4;
  const path = () => { c.beginPath(); c.moveTo(-8, 9); c.quadraticCurveTo(-21, 10 + w * 0.2, -17, -4 + w); };
  c.lineCap = 'round'; path(); c.lineWidth = 7.6; c.strokeStyle = INK; c.stroke();
  path(); c.lineWidth = 4.6; c.strokeStyle = F.m; c.stroke();
  circ(-17, -4 + w, 2.6); c.fillStyle = F.s; c.fill();
}
function pCape(s) {
  c.beginPath(); c.moveTo(-5, -3); c.quadraticCurveTo(-23, 3, -21, 17); c.lineTo(-3, 15); c.closePath(); fs(TEAM[s.team].main, 2.4);
}
function pLegs(k, s) {
  const F = FUR[k], T = TEAM[s.team], a = s.moving ? Math.sin(s.t * 1.7) * 3 : 0;
  c.globalAlpha = 0.45; ell(0, 17.4, 15, 3.2); c.fillStyle = T.main; c.fill(); c.globalAlpha = 1;
  for (const [x, ph] of [[-5, 1], [6, -1]]) { ell(x + a * ph, 15, 4.3, 3.1); fs(k === 2 ? '#c9d2e4' : F.m, 2.2); }
}
function pBody(k, s) {
  const F = FUR[k], T = TEAM[s.team];

}

  }
  for (const [key] of UPS) {
    const u = upEls[key], lv = upLevel(s, key), cost = upCost(s, key);
    u.pips.forEach((p, i) => p.classList.toggle('on', i < lv));
    u.el.classList.toggle('max', cost == null); u.el.classList.toggle('poor', !play || cost == null || gold < cost);
    setTxt(u.cost, cost == null ? '' : String(cost), 'c' + key);
    setTxt(u.desc, key === 'base' ? (cost == null ? '최대 레벨' : `Lv${s.baseLv + 1}: ${UNLOCK_NAME[s.baseLv]} 해금 · 수입↑`) : (cost == null ? '최대' : UP_DESC[key]), 'd' + key);
  }
}

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function showEnd() {
  const win = G.winner === 0, stars = win ? (G.t <= 100 ? 3 : G.t <= 180 ? 2 : 1) : 0;   // 빨리 이길수록 별이 많다
  $('endT').textContent = win ? '승리!' : '앗, 패배...'; $('endT').className = win ? 'win' : 'lose';
  $('stars').innerHTML = [0, 1, 2].map((i) => `<i class="${i < stars ? 'on' : ''}">★</i>`).join('');
  $('endS').textContent = `쓰러뜨린 고양이 ${G.stats.kills}마리 · 잃은 고양이 ${G.stats.lost}마리 · 본진 Lv${S[0].baseLv} · ${Math.round(G.t)}초`;
  $('ovEnd').hidden = false;
}
function startGame() { audio(); newGame(); G.state = 'play'; $('ovTitle').hidden = true; $('ovEnd').hidden = true; }

$('bStart').addEventListener('click', startGame);
$('bAgain').addEventListener('click', startGame);
$('bSpecial').addEventListener('click', () => { audio(); dropCan(); });
function setSlow(v) { slowManual = v; $('bSlow').classList.toggle('on', v); }
$('bSlow').addEventListener('click', () => setSlow(!slowManual));
function setMute(v) { muted = v; if (master) master.gain.value = v ? 0 : 0.5; $('bMute').textContent = v ? '소리 꺼짐' : '소리 켜짐'; $('bMute').classList.toggle('on', v); }
$('bMute').addEventListener('click', () => { audio(); setMute(!muted); });
const HOT = { b: 'base', g: 'eco', h: 'spd', j: 'atk', k: 'def' };
addEventListener('keydown', (e) => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '5') { audio(); trySpawn(+k - 1); }
  else if (k === ' ' && G.state === 'play') { e.preventDefault(); audio(); dropCan(); }
  else if (HOT[k]) { audio(); tryBuy(HOT[k]); }
  else if (k === 's') setSlow(!slowManual);
  else if (k === 'm') { audio(); setMute(!muted); }
});

/* ---------------- 녹화 (영상으로 저장) ---------------- */
let DL = null, mr = null, recStart = 0;
function stopRec() { if (mr && mr.state !== 'inactive') mr.stop(); }
function toggleRec() {
  if (mr) { stopRec(); return; }
  audio();
  const stream = cv.captureStream(30);
  if (recDest) recDest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
  const mt = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t));
  let rec; try { rec = new MediaRecorder(stream, mt ? { mimeType: mt, videoBitsPerSecond: 6e6 } : {}); } catch (e) { toast('이 브라우저에서는 녹화를 못 해요'); return; }
  const chunks = []; mr = rec;
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    mr = null; $('rec').hidden = true; $('bRec').textContent = '녹화';
    if (!chunks.length) { toast('녹화된 장면이 없어요'); return; }
    try { await DL.save({ filename: 'alley-cats.webm', data: new Blob(chunks, { type: 'video/webm' }) }); toast('영상을 저장했어요'); }
    catch (err) { toast(err && err.code === 'declined' ? '저장을 취소했어요' : '저장하지 못했어요'); }
  };
  rec.start(500); recStart = performance.now(); $('rec').hidden = false; $('bRec').textContent = '녹화 끝내기';
}
$('bRec').addEventListener('click', toggleRec);
try {
  const ok = window.claude && window.claude.use && window.MediaRecorder && cv.captureStream;
  if (ok) window.claude.use('downloads').then((d) => { DL = d; if (d) $('bRec').classList.add('show'); }).catch(() => {});
} catch (e) { /* 저장 기능이 없는 환경에서는 녹화 버튼을 숨긴 채 둔다 */ }

/* ---------------- 시작 ---------------- */
let acc = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(50, now - last); last = now;
  let n = 0; while (acc >= 1000 / 60 && n++ < 3) { acc -= 1000 / 60; step(); }
  if (acc > 100) acc = 0;
  render(); hud();
  if (mr) { const s = Math.floor((now - recStart) / 1000); $('recT').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if (s >= 90) stopRec(); }
}
buildBG(); newGame();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildBG(); paintIcons(); });
paintIcons();
})();
</script>
